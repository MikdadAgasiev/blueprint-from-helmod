desc-check-scope=Проверены соединения труб, достижимость подач и попадание посторонних ресурсов. Проверка не гарантирует производительность и распределение по дорожкам лент.
desc-contamination=Посторонний ресурс «__1__» на подаче рецепта «__2__», координаты __3__, __4__.
desc-belt-disconnected=Не подключена подача «__1__», координаты __2__.
