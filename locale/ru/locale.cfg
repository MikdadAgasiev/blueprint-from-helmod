desc-rate-limit=__1__: __2__/с из __3__/с; не хватает __4__/с.
desc-reserve=Запас промежуточных производств: __1__%.

plan-equipment-invalid=Оборудование плана Helmod нельзя воспроизвести: __1__. Проверьте типы, качество, совместимость и количество модулей/маяков.

beacon-placement-failed=Не удалось разместить маяки из Helmod для __1__ с нужным воздействием и свободными подходами. Чертёж не создан.
beacon-effects-unsafe=Воздействие маяков не соответствует плану Helmod. Чертёж не выдан.

beacon-count-difference=Маяки __1__: оценка Helmod — __2__, в чертеже — __3__. Чертёж сохраняет заданное покрытие маяками в выбранной компоновке.

distribution-label=Распределение
distribution-belts=Ленточные балансеры
distribution-containers=Контейнеры с погрузчиками
distribution-tooltip=Распределение внешнего сырья, сбор конечных продуктов и общий сбор выходов совместимых печных секций. Межблочные пути остаются конвейерами; жидкости — в трубах.
container-label=Большой контейнер
container-auto=Автоматический выбор
container-slots=__1__ ячеек
container-help=Контейнеры подключаются только погрузчиками, выбранными во вкладке «Оборудование». Для совместимых печных массивов используется общий продуктовый буфер, если его можно разместить и хватает скорости. Выходы распределяют продукцию по потреблению; строго равное деление не гарантируется. Отдельные блоки не используют эту настройку.
container-no-loader=Для контейнерного распределения нужен доступный подходящий погрузчик. Проверьте выбор во вкладке «Оборудование».
container-no-size=Нет подходящего доступного контейнера для __1__ входных и __2__ выходных лент. Выберите другой контейнер или ленточные балансеры.
container-loader-slow=Выбранный погрузчик не обеспечивает нужную подачу __1__ на одну выходную ленту. Выберите более быстрый погрузчик.

helmod-equipment-help=Качество рецептов и ресурсов, машины, модули и воздействие маяков берутся из выбранного плана Helmod. Продукция разных качеств разделяется автоматически. Машины с маяками пока размещаются отдельными ячейками; суммарное число маяков может превышать оценку Helmod.

se-beacon-overload=Space Exploration отключает машины, на которые воздействует больше одного маяка. Уменьшите число воздействующих маяков в плане Helmod.


generation-update-restart=Расчёт, начатый до обновления мода, отменён: старая копия плана могла не содержать модулей и маяков. Создайте чертёж заново из Helmod. Предметы под курсором сохранены.

resource-quality=__1__ (__2__)
quality-mixed-ingredient=В одном рецепте требуются разные качества предмета __1__. Такой вход пока не поддерживается.
quality-no-splitter=Для разделения продукции по качеству нет доступного разделителя подходящей скорости.

beacon-not-researched-plan=В плане Helmod для «__2__» настроен маяк «__1__» с модулями, но его производство ещё не изучено. Уберите этот маяк из плана и пересчитайте Helmod либо изучите его. Чертёж не создан: без этих бонусов нельзя подтвердить производительность плана.

desc-fluid-direction=Жидкость __1__ не может дойти до потребителя в __2__: проверьте направление насоса, клапана или переходника.

fluid-mode=Разводка жидкостей

fluid-ordinary=Обычные трубы

fluid-fmf=FMF на свободных прямых участках

fmf-help=Экспериментальный режим. На длинных свободных прямых участках используются забор → магистраль FMF → выдача. Входы и выходы схемы сохраняются. Занятые проходы, разветвления, двусторонние и неподходящие по скорости участки остаются обычными трубами. Переходникам нужно питание; требуется двукратный запас по их номинальной скорости. Пропускная способность всей цепочки этим выбором не гарантируется.

fmf-unavailable=Для режима FMF нужны изученные забор, выдача и короткая труба Fluid Must Flow 1.5.1+, а также совместимая обычная труба. Геометрия и направления должны поддерживаться. Сейчас этот набор недоступен.

fmf-summary=FMF: заменено прямых участков — __1__; осталось обычных труб и подземок — __2__.

phase-fmf=магистрали Fluid Must Flow

fmf-base-invalid=Исходная разводка жидкостей содержит разрывы или несовместимые соединения. FMF не применён, чертёж не создан. Уменьшите выбранный план или создайте обычную схему для проверки проблемных мест.

layout-search-label=Подбор компоновки

layout-search-normal=Обычный — до первой корректной схемы

layout-search-thorough=Тщательный — сравнение вариантов

layout-search-help=Обычный поиск ограничивает поиск маршрутов и ответвлений и завершается на первой схеме без ошибок. Тщательный поиск сравнивает больше вариантов и может дать более компактную схему, но длится дольше. Одинаковые параметры размещения не рассчитываются повторно. Число вариантов зависит от плана и настроек. Проверки соединений одинаковые. «Нагрузка генератора» отдельно задаёт работу за один тик.

layout-no-candidate=Не удалось разместить блоки без недопустимых контактов. Попробуйте тщательный подбор компоновки или отдельные блоки.

layout-search-exhausted=Обычный подбор не нашёл полностью корректную схему. Можно включить «Тщательный» подбор на вкладке «Генерация» или уменьшить план.

shape-label=Форма схемы
shape-auto=Автоматически — компактнее
shape-square=Квадрат
shape-horizontal=Прямоугольник по горизонтали
shape-vertical=Прямоугольник по вертикали
shape-help=Форма задаётся независимо от сторон входа и выхода и влияет на размещение блоков. Прямоугольник: целевое отношение сторон 2,5:1. Точные пропорции зависят от машин и соединений. Без соединений блоки сохраняют вертикальный ряд.

generation-resumed=Продолжаю сохранённый расчёт чертежа: вариант __1__. До сохранения прошло __2__ с.
generation-environment-restart=Состав модов или начальные настройки изменились: расчёт чертежа запускается заново, чтобы не использовать устаревшие данные.

loader-layout-unsupported=Не удалось спланировать __2__ для «__1__» выбранным погрузчиком. Требуется суммарно __3__ шт/с на машину, получилось __4__ шт/с. Это ограничение текущего шаблона генератора. Чертёж с недостаточной скоростью не выдан.

independent-layout-help=Без соединений: отдельные производственные блоки располагаются сверху вниз. Общие вводы сырья, сбор конечных выходов и общая форма не строятся. Локальная подача и выгрузка внутри блоков сохраняются.

desc-allocation-shortage=Соединённая подача __1__: __2__ шт/с при потребности __3__ шт/с. Часть подающих лент не удалось подключить.

lane-balance-no-splitter=Для балансировки дорожек выхода нужен изученный разделитель не медленнее выбранной выходной ленты.

notice-interval=Сообщения в чат
notice-seconds=__1__ сек.
notice-tooltip=Интервал сообщений в чате: 10, 20, 30, 60 или 120 секунд игрового времени. По умолчанию 30 секунд. Завершение и ошибки сообщаются сразу.
