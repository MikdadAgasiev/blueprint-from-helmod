capacity-incomplete=Для рецепта __1__ недостаточно пропускной способности выбранных лент или места для манипуляторов. Плановый выпуск не гарантируется; подробности в script-output/bfh-routing.log.

use-display-plates=Использовать DisplayPlatesForked
display-plates-tooltip=Обозначать внешние входы предметов табличками с иконками ресурсов. Лента проходит под табличкой через подземный конвейер; если места нет, табличка ставится рядом.
display-plates-unavailable=Установите и включите DisplayPlatesForked версии 1.7.0 или новее.
display-plates-missing=Не удалось разместить __1__ табличек входных ресурсов.

generation-started=Создаю чертёж в фоне. Сообщения о ходе расчёта — в чате. Отмена: /bfh-cancel.
