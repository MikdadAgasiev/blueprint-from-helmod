[bfh]
desc-unknown-rates=Для __1__ ресурсов нет достоверного расхода; баланс не подтверждён.
desc-external-rate=Внешняя подача __1__: __2__/с (предусмотренный вход, не ошибка).
transport-quality=Качество транспорта
transport-quality-help=Качество лент, разделителей, погрузчиков и манипуляторов. Доступны изученные качества. Производственные машины и маяки остаются как в Helmod. Подбор количества и скорости транспорта использует консервативную оценку обычного качества.
transport-quality-unavailable=Качество транспорта «__1__» недоступно или не изучено.
transport-quality-slower=Качество «__2__» уменьшает скорость манипулятора «__1__». Для такого прототипа выберите обычное качество.
output-help=Выводы конечных продуктов и вводы сырья собраны у выбранных стрелками сторон. Без соединений блоки сохраняют отдельные входы и выходы.
use-power=Разместить опоры электросети
pole-type=Тип опор
pole-auto=Автоматический выбор
power-help=Только изученные опоры. Мод покрывает электрические машины, соединяет опоры проводами и сохраняет свободный доступ к вводам и выводам. Сам источник электроэнергии подключите к сети отдельно.
generation-phase-outputs=общие выходы конечных продуктов
generation-phase-power=опоры и соединение электросети
plan-number=План __1__
tab-plans=Планы Helmod
tab-equipment=Оборудование
tab-connections=Соединения
tab-generation=Генерация
plans-help=Выберите всю линию или отдельный блок. Настройки на других вкладках применяются ко всем планам. Готовый чертёж появится под курсором; если курсор занят — в инвентаре.
equipment-help=Выберите ленты и устройства подачи и выгрузки. Производственные машины берутся из плана Helmod.
connections-help=Здесь задаются соединения между блоками, трубы и обозначения внешних входов.
generation-help=Запас мощности относится к промежуточным производствам. Нагрузка определяет, сколько работы генератор выполняет за тик.
block-recipes=Рецептов в блоке: __1__
policy-help-multiple=При нехватке скорости добавляются манипуляторы выбранного типа на свободные места. Замена на другой тип и погрузчики не разрешены.
policy-help-faster=При нехватке скорости выбранные манипуляторы заменяются более быстрыми изученными. Дополнительные манипуляторы и погрузчики не разрешены.
policy-help-loaders=Манипуляторы сохраняются, если их скорости достаточно. При недостаточной подаче или выгрузке блок сразу строится с выбранным погрузчиком и нужными отводами. Если выбранный режим невозможно реализовать поддерживаемым шаблоном, генерация остановится с объяснением.
policy-help-auto=Для подачи и выгрузки мод выбирает изученные манипуляторы подходящей скорости. При нехватке скорости добавляет манипуляторы или использует погрузчики. Оставшиеся ограничения выводятся в чат.
policy-help-auto_equipment=Мод сам выбирает изученные ленты, манипуляторы и погрузчики. Сначала он пробует ленты минимальной скорости, которые вмещают потоки без лишнего дробления блоков. Если соединения не удались, пробует самый быстрый доступный комплект.
auto-equipment-no-belts=Для автоматического подбора нужна хотя бы одна изученная лента с подходящими подземным конвейером и разделителем.
items-per-second=__1__ шт/с
