transfer-auto=Авто: манипуляторы и погрузчики
transfer-auto-equipment=Авто: ленты, манипуляторы и погрузчики
transfer-tooltip=Если подача или выгрузка машины не обеспечивает потребность:\nДобавлять выбранные манипуляторы — использовать дополнительные манипуляторы выбранного типа на свободных местах.\nЗаменять более быстрыми изученными — подобрать более производительный изученный манипулятор.\nПогрузчики при нехватке скорости — сохранить достаточные манипуляторы, а недостаточные заменить выбранным погрузчиком, где это возможно.\nПодбирать автоматически — разрешить более быстрые манипуляторы, дополнительные манипуляторы и погрузчики.\nЕсли обеспечить нужную скорость не удалось, сообщить в чат.
transfer-loader=Тип погрузчика
transfer-loader-auto=Автоматический выбор
transfer-loader-tooltip=Доступные по исследованиям погрузчики 1×1. Погрузчики с обязательной смазкой, ожиданием полной стопки и иной геометрией пока не поддерживаются. В режиме «Погрузчики» автоматическая замена на другой способ не выполняется.
transfer-limit=__2__ __3__ для __1__: __4__ шт/с при потребности __5__ шт/с на одну машину. Расчётная скорость устройств ниже потребности; усилить эту операцию в текущей компоновке не удалось.
transfer-input=Подача
transfer-output=Выгрузка
transfer-no-loaders=Нет изученных поддерживаемых погрузчиков. Поддерживаются погрузчики 1×1 без обязательной смазки и ожидания полной стопки.

generation-load=Нагрузка генератора
load-minimal=Минимальная
load-normal=Обычная
load-fast=Ускоренная
load-tooltip=Минимальная: меньше поисковой работы за тик, дольше ожидание. Ускоренная: больше работы за тик, возможны задержки игры. Ограничивает поиск; завершение этапов пока может давать краткие пики.
helmod-machine-unavailable=Рецепт __1__: выбранная в Helmod машина «__2__» отсутствует. Укажите доступную машину в плане Helmod. Автоматическая замена не выполняется.
validation-issues=Проверка готовой схемы: найдено проблем с соединениями: __1__. Подробности в script-output/bfh-routing.log. Проверьте схему перед использованием.
plan-rate-limit=Производство __1__: __2__ ед/с при потребности __3__ ед/с. Не хватает __4__ ед/с; проверьте план Helmod или дополнительную внешнюю подачу.
machine-output-disconnected=Выход __1__ из __2__ (рецепт __3__, координаты __4__, __5__) не соединён с выходной лентой блока.
machine-feed-disconnected=Подача __1__ не доходит до __2__ (рецепт __3__, координаты __4__, __5__). Проверьте ленты внутри блока и загрузочное оборудование.
reserve-label=Запас мощности
reserve-exact=Точно по Helmod
reserve-tooltip=Увеличить мощность промежуточных производств на выбранный процент. Конечные производства и выбранные типы машин сохраняются. Количество машин округляется вверх: небольшой запас может добавить целую машину. Подача и выгрузка рассчитываются с учётом увеличенных потоков. Рецепты со смешанными конечными и промежуточными выходами не увеличиваются автоматически.

rotation-per-second=__1__ оборота/с
