helmod-equipment-help=Recipe and resource qualities, machines, modules and beacon effects follow the selected Helmod plan. Different product qualities are sorted automatically. Beacon layouts currently use separate machine cells and may require more beacons than Helmod estimates.

se-beacon-overload=Space Exploration disables machines affected by more than one beacon. Reduce the affecting beacon count in the Helmod plan.


