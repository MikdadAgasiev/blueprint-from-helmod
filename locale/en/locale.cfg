fmf-help=Keep ordinary pipes while each connected pipeline fits the Factorio extent limit. For an oversized pipeline, prefer an ordinary pump when its throughput is sufficient; otherwise use a directed FMF section. Internal FMF branches use native duct junctions without an ordinary-pipe round trip. Pumps and adapters need power.

