policy-help-multiple=Add inserters of the selected type in free slots when throughput is insufficient. Do not upgrade types or use loaders.
policy-help-faster=Replace insufficient inserters with faster researched ones. Do not add inserters or use loaders.
policy-help-loaders=Keep inserters when their rate is sufficient. Insufficient operations are built with the selected loader and its belt connections from the start. Generation stops with an explanation if no supported template can implement the selection.
policy-help-auto=Choose researched inserters with sufficient speed for each input and output. Add inserters or use loaders where needed. Unresolved limits are reported in chat.
policy-help-auto_equipment=Choose researched belts, inserters and loaders automatically. Start with the slowest belts that can carry the planned flows without extra blocks. Try the fastest available belt set if connections fail.
auto-equipment-no-belts=Automatic equipment requires at least one researched belt with a matching underground belt and splitter.
