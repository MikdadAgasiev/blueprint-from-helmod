layout-search-help=Normal search bounds route and branch searches and stops at the first layout without errors. Thorough search compares more candidates and may find a more compact result, but takes longer. Identical placement options are not calculated again. The number of candidates depends on the plan and settings. Both modes use the same connection checks. Generator load separately controls work per tick.

layout-no-candidate=No placement without invalid contacts was found. Try thorough layout search or independent blocks.

layout-search-exhausted=Normal search did not find a fully valid layout. Try Thorough search in Generation, or reduce the plan.

